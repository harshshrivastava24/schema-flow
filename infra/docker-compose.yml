version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: schemaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-schemaflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: schemaflow-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/schemaflow
      COMPILER_BINARY_PATH: /usr/local/bin/compiler
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    container_name: schemaflow-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    command: ["sh", "-c", "echo 'Web service container initialized'"]

volumes:
  pgdata:
